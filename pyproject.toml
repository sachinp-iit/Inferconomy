[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inferconomy"
dynamic = ["version"]
description = "Adaptive LLM inference optimization: minimum sufficient computation, per request."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sachin Pate" }]
keywords = [
    "llm",
    "inference",
    "token-economy",
    "test-time-compute",
    "cost-optimization",
    "cost-quality-frontier",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# No runtime dependencies. Inferconomy wraps a client the caller already
# provides; it should never force a provider SDK or a framework on anyone.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/sachinp-iit/Inferconomy"
Repository = "https://github.com/sachinp-iit/Inferconomy"
Issues = "https://github.com/sachinp-iit/Inferconomy/issues"
Changelog = "https://github.com/sachinp-iit/Inferconomy/blob/main/README.md#progress-log"

[tool.hatch.version]
path = "src/inferconomy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/inferconomy"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "benchmarks", "README.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 88
src = ["src", "tests"]
# Formatter adds a trailing comma that JSON does not allow, so a committed config
# parsed as data would stop parsing if a formatter touched it.
extend-exclude = ["benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
